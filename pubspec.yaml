name: winche_core
description: >-
  Core primitives for the Winche Dart stack: the app registry, the session
  every service is bound to, the service contracts each Winche package
  implements, and the shared identity and options models.
version: 1.0.0
homepage: https://github.com/FlameOfUdun/winche-core-dart-sdk
repository: https://github.com/FlameOfUdun/winche-core-dart-sdk
issue_tracker: https://github.com/FlameOfUdun/winche-core-dart-sdk/issues

environment:
  sdk: ^3.10.0

dependencies:
  meta: ^1.16.0
  crypto: ^3.0.7
  http: ^1.5.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
